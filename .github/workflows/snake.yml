name: Generate contribution snake

# Builds an animated "snake" from your REAL GitHub contribution graph using
# the widely-used Platane/snk action, and publishes it to a dedicated
# `output` branch. README.md references the raw file on that branch, so
# nothing here needs to be committed to main.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG/GIF
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=%2339ff8f&color_dots=%23123321,%23155c2f,%231d8a44,%2325b859,%2339ff8f

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
