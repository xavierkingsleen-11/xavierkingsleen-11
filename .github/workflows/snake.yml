name: generate snake
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: xavierkingsleen-11
          outputs: |
            assets/snake.svg
      - uses: crazy-max/ghaction-github-pages@v4
        if: false
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: generate snake animation
          file_pattern: assets/snake.svg
