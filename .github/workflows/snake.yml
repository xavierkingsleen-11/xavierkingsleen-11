name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: xavierkingsleen-11
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette_name=github-dark&color_snake=#00D4FF&color_dots=#0A1628,#003d5c,#0077a8,#00a8e8,#00D4FF

      - name: Push snake.svg
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
